name: Validate ThaanaPDF
on:
  push:
    branches:
      - deploy/thaana-pdf-editor
    paths:
      - "thaana-editor/**"
      - ".github/workflows/thaana-check.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check editor source and feature wiring
        run: node thaana-editor/test.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise form builder in real browser
        run: node thaana-editor/e2e.mjs
      - name: Keep design QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-studio-screenshots
          path: thaana-editor/test-screenshots/
          if-no-files-found: ignore
