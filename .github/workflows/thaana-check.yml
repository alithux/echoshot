name: Validate ThaanaPDF
on:
  push:
    branches:
      - deploy/thaana-pdf-editor
    paths:
      - "thaana-editor/**"
      - ".github/workflows/thaana-check.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check editor source and feature wiring
        run: node thaana-editor/test.mjs
